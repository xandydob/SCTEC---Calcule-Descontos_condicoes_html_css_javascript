<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />

    <title>Calculadora de Desconto</title>
  </head>
  <body>
    <main class="container">
      <p class="description">
        Insira os valores abaixo para calcular o preço final do seu produto de
        forma mais rápida.
      </p>

      <div class="input-group">
        <label for="preco-original">Preço Original (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 100.00" step="0.01" />
      </div>

      <div class="input-group">
        <label for="desconto">Porcentagem de Desconto (%):</label>
        <input type="number" id="desconto" placeholder="Ex: 15" step="1" />
      </div>

      <button onclick="calcularPrecoFinal()">Calcular Preço Final</button>
    </main>

    
  </body>
</html>
